<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essay writing workshop</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .band .rf { font-size: 22px; line-height: 1; padding: 6px 12px; border-radius: 10px; }
  button.opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; font-size: 16px; }
  button.opt ol { margin: 6px 0 0; padding-left: 22px; font-size: 15px; }
  button.opt.chosen { background: var(--blue-soft); border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue) inset; }
  button.opt.tick { padding: 11px 14px; }
  .bands { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .bands button { font-size: 17px; padding: 12px 6px; }
  .bands button.chosen { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  textarea { width: 100%; font: inherit; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
  details.card summary { cursor: pointer; }
  .okt { color: var(--ok); font-weight: 600; }
  h3 { margin-top: 10px; }
</style>
</head>
<body class="student">
  <div class="band">
    <div><div class="brand">Essay writing workshop</div><div class="sub" id="modname"></div></div>
    <div style="display:flex;align-items:center;gap:8px"><span id="status" class="small muted"></span><button class="rf" id="refresh" title="Refresh">↻</button></div>
  </div>
  <main id="view"><p class="muted">Loading…</p></main>

  <script src="../shared/config.js"></script>
  <script src="../shared/lib/firebase-app-compat.js"></script>
  <script src="../shared/lib/firebase-firestore-compat.js"></script>
  <script src="../shared/store.js"></script>
  <script src="js/common.js?v=1"></script>
  <script src="js/student.js?v=1"></script>
</body>
</html>
